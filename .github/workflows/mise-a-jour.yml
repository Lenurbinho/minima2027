name: Mise à jour des minima 2027

# Lancement entièrement automatique, sans PC allumé :
#   • 4 créneaux la nuit. Constat de novembre 2026 : GitHub déclenche ses crons avec 7h30
#     à 10h30 de retard (créneau de 07:35 exécuté vers 15h-16h). Programmés la nuit, ils
#     tombent ainsi le matin. Sans retard, la mise à jour se ferait la veille au soir.
#   • Chaque créneau vérifie d'abord si un créneau a déjà réussi dans les 12 dernières
#     heures, et ne fait rien dans ce cas : un créneau sauté ou en échec est rattrapé par
#     le suivant, et il n'y a qu'une mise à jour par jour.
#   • à la main : onglet Actions → "Run workflow", ou `gh workflow run mise-a-jour.yml`
#     (un lancement manuel tourne toujours et n'empêche pas les créneaux automatiques).
on:
  workflow_dispatch:
  schedule:
    - cron: '35 21 * * *'   # 22:35 à Paris l'hiver → ~7h le lendemain avec le retard habituel
    - cron: '35 22 * * *'   # rattrapage
    - cron: '35 23 * * *'   # rattrapage
    - cron: '35 2 * * *'    # rattrapage tardif

permissions:
  contents: write
  actions: read

# Deux lancements rapprochés ne tournent jamais en même temps : le second attend,
# puis voit que le premier a réussi et s'arrête.
concurrency:
  group: mise-a-jour-minima
  cancel-in-progress: false

jobs:
  scraping:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Paris
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Déjà mis à jour ces 12 dernières heures ?
        id: deja
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "fait=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          limite=$(( $(date +%s) - 12 * 3600 ))
          n=$(gh run list --repo "${{ github.repository }}" --workflow mise-a-jour.yml \
                --status success --limit 30 --json createdAt,event \
                --jq "[.[] | select(.event == \"schedule\" and (.createdAt | fromdateiso8601) >= $limite)] | length")
          if [ "$n" -gt 0 ]; then
            echo "Mise à jour déjà faite par un créneau il y a moins de 12 h : rien à faire."
            echo "fait=true" >> "$GITHUB_OUTPUT"
          else
            echo "fait=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Récupération du dépôt
        if: steps.deja.outputs.fait != 'true'
        uses: actions/checkout@v5

      - name: Python
        if: steps.deja.outputs.fait != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dépendances
        if: steps.deja.outputs.fait != 'true'
        run: pip install requests beautifulsoup4

      - name: Scraping WA + FFA
        if: steps.deja.outputs.fait != 'true'
        run: python scraper.py | tee scraping.log

      - name: Résumé du run
        if: steps.deja.outputs.fait != 'true'
        run: |
          {
            echo "### Minima 2027 — $(date +'%d/%m/%Y %H:%M')"
            grep -E "qualifié|🆕|⚠️" scraping.log | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publication des résultats
        if: steps.deja.outputs.fait != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/achievements.json
          if git diff --staged --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git commit -m "Minima mis à jour – $(date +'%d/%m/%Y %H:%M')"
          git pull --rebase --quiet
          git push
